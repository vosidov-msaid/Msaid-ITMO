name: "bracket_validator: ([]{})"
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [40, 91, 93, 123, 125, 41, 10]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}:	{instruction:next}	{pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [1]
